<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        main {
            padding: 40px 30px;
        }

        section {
            margin-bottom: 30px;
        }

        section.hidden {
            display: none !important;
        }

        .form-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
            width: 100%;
        }

        .input-field {
            flex: 1;
            min-width: 250px;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .input-field:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #4caf50;
            color: white;
        }

        .btn-success:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .btn-secondary {
            background: #999;
            color: white;
        }

        .btn-secondary:hover {
            background: #777;
        }

        .info-card {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
        }

        .info-content-item {
            margin-bottom: 15px;
        }

        .info-content-item label {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 5px;
        }

        .info-content-item p {
            color: #555;
            line-height: 1.6;
            word-break: break-all;
        }

        .thumbnail-img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .quality-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .quality-option {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }

        .quality-option:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .quality-option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .quality-option-label {
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
        }

        .quality-option-info {
            font-size: 0.85em;
            opacity: 0.8;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .progress-card {
            background: #f8f9fa;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 20px;
        }

        .progress-card h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 0.9em;
        }

        .progress-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .progress-info span {
            background: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.9em;
            color: #555;
        }

        .error-card {
            background: #ffebee;
            border: 2px solid #f44336;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .error-card h3 {
            color: #c62828;
            margin-bottom: 10px;
        }

        .error-card p {
            color: #d32f2f;
            margin-bottom: 15px;
            word-break: break-word;
        }

        .success-card {
            background: #e8f5e9;
            border: 2px solid #4caf50;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .success-card h3 {
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .success-card p {
            color: #388e3c;
            margin-bottom: 15px;
        }

        footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #999;
            border-top: 1px solid #e0e0e0;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8em;
            }

            .form-group {
                flex-direction: column;
            }

            .input-field {
                width: 100%;
            }

            .quality-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }

            main {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎥 YouTube Downloader</h1>
            <p>Download videos and playlists with audio in high quality</p>
        </header>

        <main>
            <!-- Input Section -->
            <section class="input-section">
                <div class="form-group">
                    <label for="url-input">YouTube URL:</label>
                    <input 
                        type="text" 
                        id="url-input" 
                        placeholder="Paste YouTube URL here..." 
                        class="input-field"
                    >
                    <button id="fetch-btn" class="btn btn-primary">Get Info</button>
                </div>
            </section>

            <!-- Video/Playlist Info Section -->
            <section id="info-section" class="hidden">
                <div class="info-card">
                    <div id="info-content"></div>
                </div>
            </section>

            <!-- Quality Selection Section -->
            <section id="quality-section" class="hidden">
                <h3>Select Quality:</h3>
                <div id="quality-options" class="quality-grid"></div>
                <div class="button-group">
                    <button id="download-btn" class="btn btn-success">Download</button>
                </div>
            </section>

            <!-- Progress Section -->
            <section id="progress-section" class="hidden">
                <div class="progress-card">
                    <h3>Downloading...</h3>
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                    <div class="progress-info">
                        <span id="progress-percent">0%</span>
                        <span id="progress-speed">-</span>
                        <span id="progress-eta">-</span>
                    </div>
                    <p id="progress-message"></p>
                </div>
            </section>

            <!-- Error Section -->
            <section id="error-section" class="hidden">
                <div class="error-card">
                    <h3>⚠️ Error</h3>
                    <p id="error-message"></p>
                    <button id="close-error-btn" class="btn btn-secondary">Close</button>
                </div>
            </section>

            <!-- Success Section -->
            <section id="success-section" class="hidden">
                <div class="success-card">
                    <h3>✅ Download Complete!</h3>
                    <p id="success-message"></p>
                    <button id="close-success-btn" class="btn btn-primary">Start New Download</button>
                </div>
            </section>
        </main>

        <footer>
            <p>YouTube Downloader v1.0 | Use responsibly</p>
        </footer>
    </div>

    <script>
        const urlInput = document.getElementById('url-input');
        const fetchBtn = document.getElementById('fetch-btn');
        const infoSection = document.getElementById('info-section');
        const qualitySection = document.getElementById('quality-section');
        const progressSection = document.getElementById('progress-section');
        const errorSection = document.getElementById('error-section');
        const successSection = document.getElementById('success-section');

        let currentUrl = '';
        let currentInfo = null;
        let selectedFormat = null;

        // Event listeners
        fetchBtn.addEventListener('click', fetchVideoInfo);
        document.getElementById('download-btn').addEventListener('click', startDownload);
        document.getElementById('close-error-btn').addEventListener('click', hideError);
        document.getElementById('close-success-btn').addEventListener('click', resetForm);

        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                fetchVideoInfo();
            }
        });

        async function fetchVideoInfo() {
            const url = urlInput.value.trim();
            
            if (!url) {
                showError('Please enter a YouTube URL');
                return;
            }

            currentUrl = url;
            hideAllSections();
            showLoading('Fetching video information...');

            try {
                const response = await fetch(`/api/info?url=${encodeURIComponent(url)}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Failed to fetch video info');
                }

                currentInfo = data;
                displayInfo(data);
                
                if (data.type === 'video') {
                    displayQualityOptions(data.formats);
                } else {
                    showQualitySection(false);
                }

            } catch (error) {
                showError(error.message);
            }
        }

        function displayInfo(info) {
            const infoContent = document.getElementById('info-content');
            let html = '';

            if (info.type === 'video') {
                html = `
                    <div class="info-content-item">
                        <label>Video Title</label>
                        <p>${escapeHtml(info.title)}</p>
                    </div>
                    ${info.thumbnail ? `<img src="${info.thumbnail}" alt="Thumbnail" class="thumbnail-img">` : ''}
                    <div class="info-content-item">
                        <label>Duration</label>
                        <p>${formatDuration(info.duration)}</p>
                    </div>
                    <div class="info-content-item">
                        <label>Uploader</label>
                        <p>${escapeHtml(info.uploader || 'Unknown')}</p>
                    </div>
                `;
            } else if (info.type === 'playlist') {
                html = `
                    <div class="info-content-item">
                        <label>Playlist Title</label>
                        <p>${escapeHtml(info.title)}</p>
                    </div>
                    <div class="info-content-item">
                        <label>Total Videos</label>
                        <p>${info.video_count}</p>
                    </div>
                    <div class="info-content-item">
                        <label>First Videos:</label>
                        ${info.videos.map(v => `
                            <div style="background: white; padding: 10px; margin: 5px 0; border-radius: 5px; border-left: 3px solid #667eea;">
                                ${escapeHtml(v.title)} (${formatDuration(v.duration)})
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            infoContent.innerHTML = html;
            infoSection.classList.remove('hidden');
        }

        function displayQualityOptions(formats) {
            const qualityOptions = document.getElementById('quality-options');
            
            let html = '<div class="quality-option selected" data-format="best">' +
                       '<span class="quality-option-label">🎯 Best</span>' +
                       '<span class="quality-option-info">Auto select best</span>' +
                       '</div>';

            formats.forEach(format => {
                const quality = format.resolution ? `${format.resolution}p` : 'Mixed';
                const filesize = format.filesize ? `(${formatFilesize(format.filesize)})` : '';
                
                html += `
                    <div class="quality-option" data-format="${format.format_id}">
                        <span class="quality-option-label">${quality}</span>
                        <span class="quality-option-info">${filesize}</span>
                    </div>
                `;
            });

            qualityOptions.innerHTML = html;

            document.querySelectorAll('.quality-option').forEach(option => {
                option.addEventListener('click', () => {
                    document.querySelectorAll('.quality-option').forEach(o => o.classList.remove('selected'));
                    option.classList.add('selected');
                    selectedFormat = option.dataset.format;
                });
            });

            selectedFormat = 'best';
            showQualitySection(true);
        }

        async function startDownload() {
            if (!selectedFormat) {
                showError('Please select a quality');
                return;
            }

            hideAllSections();
            showProgressSection();

            try {
                const isPlaylist = currentInfo.type === 'playlist';
                const response = await fetch(
                    `/api/download?url=${encodeURIComponent(currentUrl)}&format_id=${selectedFormat}&is_playlist=${isPlaylist}`,
                    { method: 'POST' }
                );

                if (!response.ok) {
                    throw new Error('Download failed');
                }

                monitorProgress();

            } catch (error) {
                showError(error.message);
            }
        }

        async function monitorProgress() {
            const maxAttempts = 300;
            let attempts = 0;

            const checkInterval = setInterval(async () => {
                try {
                    attempts++;

                    const progressResponse = await fetch('/api/progress');
                    const progressData = await progressResponse.json();

                    if (progressData.status === 'downloading') {
                        updateProgress(progressData);
                    }

                    const resultResponse = await fetch('/api/result');
                    const resultData = await resultResponse.json();

                    if (resultData.message && !resultData.message.includes('No download')) {
                        clearInterval(checkInterval);
                        showSuccess(resultData);
                        return;
                    }

                    if (attempts > maxAttempts) {
                        clearInterval(checkInterval);
                        showError('Download timeout');
                        return;
                    }

                } catch (error) {
                    console.error('Progress check error:', error);
                }
            }, 1000);
        }

        function updateProgress(data) {
            const progressFill = document.getElementById('progress-fill');
            const progressPercent = document.getElementById('progress-percent');
            const progressSpeed = document.getElementById('progress-speed');
            const progressEta = document.getElementById('progress-eta');

            const percentValue = parseInt(data.percent) || 0;
            progressFill.style.width = percentValue + '%';
            progressFill.textContent = percentValue + '%';

            progressPercent.textContent = data.percent || '0%';
            progressSpeed.textContent = 'Speed: ' + (data.speed || '-');
            progressEta.textContent = 'ETA: ' + (data.eta || '-');
        }

        function showSuccess(result) {
            hideAllSections();
            successSection.classList.remove('hidden');
            document.getElementById('success-message').textContent = result.message || 'Download completed!';
        }

        function showError(message) {
            hideAllSections();
            errorSection.classList.remove('hidden');
            document.getElementById('error-message').textContent = message;
        }

        function hideError() {
            errorSection.classList.add('hidden');
        }

        function hideAllSections() {
            infoSection.classList.add('hidden');
            qualitySection.classList.add('hidden');
            progressSection.classList.add('hidden');
            errorSection.classList.add('hidden');
            successSection.classList.add('hidden');
        }

        function showQualitySection(show) {
            if (show) {
                qualitySection.classList.remove('hidden');
            } else {
                qualitySection.classList.add('hidden');
            }
        }

        function showProgressSection() {
            progressSection.classList.remove('hidden');
        }

        function showLoading(message) {
            hideAllSections();
            progressSection.classList.remove('hidden');
            document.getElementById('progress-message').textContent = message;
        }

        function resetForm() {
            hideAllSections();
            urlInput.value = '';
            currentUrl = '';
            currentInfo = null;
            selectedFormat = null;
        }

        function formatDuration(seconds) {
            if (!seconds) return 'Unknown';
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;

            if (hours > 0) {
                return `${hours}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }
            return `${minutes}:${String(secs).padStart(2, '0')}`;
        }

        function formatFilesize(bytes) {
            const units = ['B', 'KB', 'MB', 'GB'];
            let size = bytes;
            let unitIndex = 0;

            while (size >= 1024 && unitIndex < units.length - 1) {
                size /= 1024;
                unitIndex++;
            }

            return size.toFixed(2) + ' ' + units[unitIndex];
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        console.log('YouTube Downloader loaded successfully!');
    </script>
</body>
</html>
